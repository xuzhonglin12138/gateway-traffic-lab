<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网关流量测试工具</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">Rainbond 网关监控测试</p>
          <h1>网关流量测试工具</h1>
        </div>
        <div class="status-pill" id="runState">空闲</div>
      </header>

      <section class="layout">
        <div class="panel controls">
          <div class="section-head">
            <h2>测试配置</h2>
            <button id="stopBtn" class="ghost danger" type="button">停止</button>
          </div>

          <div class="tabs" role="tablist" aria-label="测试类型">
            <button class="tab active" data-mode="normal" type="button" role="tab" aria-selected="true">
              普通测试
            </button>
            <button class="tab" data-mode="stress" type="button" role="tab" aria-selected="false">
              压力测试
            </button>
            <button class="tab" data-mode="continuous" type="button" role="tab" aria-selected="false">
              持续测试
            </button>
          </div>

          <p class="mode-help" id="modeHelp">适合验证网关路径、状态码和延迟采集。</p>

          <form id="trafficForm" class="form">
            <label>
              目标类型
              <select id="target">
                <option value="ping">快速成功</option>
                <option value="random">随机延迟/错误</option>
                <option value="error">指定错误码</option>
                <option value="user">用户设置分组</option>
                <option value="order">订单详情分组</option>
                <option value="report">报表列表分组</option>
                <option value="echo">回显负载</option>
              </select>
            </label>

            <label>
              请求方法
              <select id="method">
                <option>GET</option>
                <option>POST</option>
                <option>PUT</option>
                <option>DELETE</option>
              </select>
            </label>

            <label>
              请求总数
              <input id="count" type="number" min="0" max="2000" value="20" />
            </label>

            <label>
              并发数
              <input id="concurrency" type="number" min="1" max="80" value="3" />
            </label>

            <label>
              持续间隔 ms
              <input id="intervalMs" type="number" min="0" max="10000" value="0" />
            </label>

            <label>
              服务延迟 ms
              <input id="delayMs" type="number" min="0" max="30000" value="0" />
            </label>

            <label>
              响应状态码
              <input id="status" type="number" min="200" max="599" value="200" />
            </label>

            <label>
              错误率 %
              <input id="errorRate" type="number" min="0" max="100" value="0" />
            </label>

            <label>
              负载大小 bytes
              <input id="payloadBytes" type="number" min="0" max="1048576" value="0" />
            </label>

            <button id="singleBtn" class="primary" type="submit">发送当前路由</button>
            <button id="mixedBtn" class="secondary" type="button">混合发送多路由</button>
          </form>
        </div>

        <div class="panel results">
          <div class="section-head">
            <h2>运行结果</h2>
            <button id="clearBtn" class="ghost" type="button">清空</button>
          </div>

          <div class="metrics">
            <div><span id="runMode">普通请求</span><small>当前层级</small></div>
            <div><span id="sent">0</span><small>已发送</small></div>
            <div><span id="success">0</span><small>成功 2xx-3xx</small></div>
            <div><span id="failed">0</span><small>失败 4xx-5xx</small></div>
            <div><span id="avg">0 ms</span><small>平均耗时</small></div>
            <div><span id="elapsed">0 秒</span><small>运行时长</small></div>
          </div>

          <div class="progress-line">
            <div class="progress">
              <div id="progressBar"></div>
            </div>
            <span id="progressText">0/0</span>
          </div>

          <div class="notice">
            压力测试会产生大量浏览器请求，请仅在测试环境使用，并关注网关、应用和节点资源。
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>序号</th>
                  <th>方法</th>
                  <th>路径</th>
                  <th>分组</th>
                  <th>状态</th>
                  <th>客户端耗时</th>
                  <th>服务端延迟</th>
                </tr>
              </thead>
              <tbody id="logRows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
